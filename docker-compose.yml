services:
  postgres:
    image: postgres:17-alpine
    container_name: smart-expiry-postgres
    environment:
      POSTGRES_DB: smart_expiry
      POSTGRES_USER: smart_expiry
      POSTGRES_PASSWORD: smart_expiry
    ports:
      - "5432:5432"
    volumes:
      - smart_expiry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_expiry -d smart_expiry"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  smart_expiry_pgdata:
