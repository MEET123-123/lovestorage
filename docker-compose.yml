services:
  postgres:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:17-alpine}
    container_name: smart-expiry-postgres
    environment:
      POSTGRES_DB: smart_expiry
      POSTGRES_USER: ${DB_USERNAME:-smart_expiry}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smart_expiry}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - smart_expiry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: [server]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        JAVA_IMAGE: ${JAVA_IMAGE:-public.ecr.aws/docker/library/eclipse-temurin:21-jre}
    environment:
      SPRING_PROFILES_ACTIVE: default
      DB_URL: jdbc:postgresql://postgres:5432/smart_expiry
      DB_USERNAME: ${DB_USERNAME:-smart_expiry}
      DB_PASSWORD: ${DB_PASSWORD:-smart_expiry}
      SERVER_PORT: 8080
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  smart_expiry_pgdata:
