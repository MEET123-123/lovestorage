name: contract-ci

on:
  push:
    paths:
      - 'contract/**'
      - 'scripts/**'
      - 'entry/src/ohosTest/ets/test/fixtures/**'
  pull_request:
    paths:
      - 'contract/**'
      - 'scripts/**'
      - 'entry/src/ohosTest/ets/test/fixtures/**'

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Regenerate ArkTS fixture
        run: python3 scripts/sync_expiry_fixture.py
      - name: Ensure generated fixture is committed
        run: git diff --exit-code
