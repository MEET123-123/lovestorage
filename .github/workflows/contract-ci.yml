name: contract-ci

on:
  push:
    paths:
      - 'shared/**'
      - 'scripts/**'
      - 'harmonyos/entry/src/ohosTest/ets/test/fixtures/**'
      - '.github/workflows/contract-ci.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'scripts/**'
      - 'harmonyos/entry/src/ohosTest/ets/test/fixtures/**'

jobs:
  shared-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify generated ArkTS fixture
        run: python3 scripts/verify_shared_fixtures.py
