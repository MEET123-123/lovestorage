openapi: 3.1.0
info:
  title: Smart Expiry API
  version: 1.4.0-local
  description: Authenticated local candidate with account inventory, revision-checked backups and deterministic recognition.
security:
  - bearerAuth: []
servers:
  - url: http://localhost:8080
paths:
  /api/v1/sync/inventory:
    get:
      operationId: listInventorySnapshots
      summary: List current account full inventory including deletion tombstones
      responses:
        '200': { description: 'Envelope data is an array of InventorySnapshot' }
        '401': { description: Authentication required }
  /api/v1/sync/inventory/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getInventorySnapshot
      responses:
        '200': { description: 'Envelope data is InventorySnapshot' }
        '404': { description: Missing or owned by another account }
    put:
      operationId: saveInventorySnapshot
      summary: Atomically replace inventory and all batches using expected version
      description: Omit expectedVersion on initial create. Identical payload replay succeeds. Conflict requires explicit user choice. Tombstones cannot be implicitly restored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryWrite' }
      responses:
        '200': { description: 'Envelope data is InventorySnapshot' }
        '400': { description: Invalid snapshot or batch fields }
        '404': { description: Inventory or batch belongs to another account }
        '409': { description: Version conflict }
  /api/v1/events/status:
    get:
      operationId: eventQueueStatus
      summary: Count current account pending and published events
      responses:
        '200': { description: 'Envelope data contains pending and published integer counts' }
        '401': { description: Authentication required }
  /api/v1/events/export:
    get:
      operationId: exportAlgorithmEvents
      summary: Export only current account published events for offline evaluation
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: after
          in: query
          schema: { type: string, format: uuid }
          description: nextCursor returned by the preceding page
      responses:
        '200':
          description: 'Envelope data has events and nextCursor (null at end). Each event also has recordedAt, separate from occurredAt.'
        '400': { description: Invalid limit or cursor format }
        '401': { description: Authentication required }
        '404': { description: Cursor does not belong to current account }
  /api/v1/events:
    post:
      operationId: ingestBehaviorEvents
      summary: Ingest 1 to 100 account-owned events through transactional outbox
      description: eventId is idempotent. occurredAt preserves original action time. Unknown properties and raw recognition data are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: '#/components/schemas/BehaviorEvent' }
      responses:
        '200': { description: Envelope data is accepted event count }
        '400': { description: Invalid event or private fields }
        '404': { description: Inventory not owned by current account }
        '409': { description: Event ID already used with different content }
  /api/v1/attention:
    get:
      operationId: listAttention
      summary: Rank the current account's synchronized inventory using deterministic rules
      description: Uses Asia/Shanghai natural date. Excludes handled items. Ranks the earliest effective expiry among active batches with aggregate quantity. Full sync includes snooze and reminder overrides; pending local edits remain on-device.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        '200':
          description: Stable score-descending ranking. Attention priority is not food safety or recognition confidence.
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AttentionDecision' }
        '400': { description: Invalid limit }
        '401': { description: Login required }
  /api/v1/auth/register:
    post:
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Registered; username normalized to lowercase. Session expires after 12 hours.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '400': { description: Invalid credentials format }
        '409': { description: Username already exists }
        '429': { description: Auth request rate exceeded; retry after 60 seconds }
  /api/v1/auth/login:
    post:
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthEnvelope' }
        '401': { description: Invalid credentials }
        '429': { description: Auth request rate exceeded }
  /api/v1/auth/me:
    get:
      operationId: currentUser
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/User' }
        '401': { description: Missing, expired or revoked token }
  /api/v1/auth/logout:
    post:
      operationId: logout
      responses:
        '200': { description: Current token revoked; data is true }
        '401': { description: Missing or expired token }
  /api/v1/auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 12, maxLength: 64, writeOnly: true }
                newPassword: { type: string, minLength: 12, maxLength: 64, writeOnly: true }
      responses:
        '200': { description: Password changed; all account sessions revoked; data is true }
        '401': { description: Invalid session or current password }
  /api/v1/backup:
    get:
      operationId: getBackup
      responses:
        '200':
          description: Current account backup; revision 0 and empty payload if absent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupEnvelope' }
        '401': { description: Authentication required }
    put:
      operationId: saveBackup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRevision, payload]
              properties:
                expectedRevision: { type: integer, format: int64, minimum: 0 }
                payload:
                  type: string
                  minLength: 2
                  maxLength: 500000
                  description: JSON snapshot schemaVersion=1 with items, records, shopping arrays, each at most 10000 entries. App validates individual fields before restoration. Settings and credentials are excluded.
      responses:
        '200':
          description: Stored atomically; revision incremented
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupEnvelope' }
        '400': { description: Invalid snapshot }
        '401': { description: Authentication required }
        '409': { description: Stale revision; caller must not silently overwrite }
  /api/v1/recognition/text:
    post:
      operationId: recognizeText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200':
          description: Rule-generated draft only; never writes inventory. Missing or conflicting dates remain empty. Confidence indicates rule strength, not measured probability.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/RecognitionDraft' }
        '400': { description: Invalid text }
        '401': { description: Authentication required }
  /api/v1/health:
    get:
      security: []
      operationId: health
      tags: [System]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseHealth'
  /api/v1/categories:
    get:
      operationId: listCategories
      tags: [Category]
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
  /api/v1/items:
    get:
      operationId: listItems
      tags: [Item]
      responses:
        '200':
          description: Active item list
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ItemResponse' }
    post:
      operationId: createItem
      tags: [Item]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemRequest' }
      responses:
        '200':
          description: Created item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseItem' }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /api/v1/items/{itemId}:
    parameters:
      - in: path
        name: itemId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getItem
      tags: [Item]
      responses:
        '200':
          description: Item detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseItem' }
        '404':
          description: Item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
    patch:
      operationId: updateItem
      tags: [Item]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseItem' }
    put:
      operationId: updateItemCompatible
      description: Partial update alias for HarmonyOS API 20 HTTP clients without PATCH support. Omitted or null fields stay unchanged.
      tags: [Item]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemRequest' }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponseItem' }
    delete:
      operationId: deleteItem
      tags: [Item]
      responses:
        '200':
          description: Soft deleted
          content:
            application/json:
              schema:
                type: object
                required: [code, message, data]
                properties:
                  code: { type: integer, example: 0 }
                  message: { type: string, example: success }
                  data: { type: boolean, example: true }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: Opaque token returned by register or login }
  schemas:
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9_]{3,32}$' }
        password: { type: string, minLength: 12, maxLength: 64, writeOnly: true }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
    AuthEnvelope:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            accessToken: { type: string }
            expiresAt: { type: string, format: date-time }
            user: { $ref: '#/components/schemas/User' }
    BackupEnvelope:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          type: object
          properties:
            revision: { type: integer, format: int64 }
            payload: { type: string }
            updatedAt: { type: [string, 'null'], format: date-time }
    RecognitionDraft:
      type: object
      properties:
        name: { type: string }
        production: { type: string, description: YYYY-MM-DD or empty }
        expiry: { type: string, description: YYYY-MM-DD or empty }
        shelfLife: { type: string, description: Integer text or empty }
        unit: { type: integer, enum: [0, 1, 2], description: Day / month / year }
        requiresConfirmation: { type: boolean, const: true }
        engineVersion: { type: string }
        warnings: { type: array, items: { type: string } }
        candidates:
          type: array
          items:
            type: object
            properties:
              field: { type: string, enum: [production, expiry] }
              value: { type: string, format: date }
              evidence: { type: string }
              confidence: { type: number }
    ApiResponseHealth:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data:
          type: object
          required: [status, service]
          properties:
            status: { type: string, example: UP }
            service: { type: string, example: smart-expiry-server }
    ApiResponseItem:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: success }
        data: { $ref: '#/components/schemas/ItemResponse' }
    ApiError:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
        data: { nullable: true }
    Category:
      type: object
      required: [id, name, type]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [FOOD, COSMETICS, PET_FOOD, OTHER] }
    CreateItemRequest:
      type: object
      required: [name, categoryId]
      properties:
        clientId: { type: string, format: uuid, description: Optional stable client UUID; retry returns the existing item. Deleted IDs cannot be reused. }
        name: { type: string, minLength: 1, maxLength: 120 }
        categoryId: { type: string }
        brand: { type: string, maxLength: 120 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 999999999, multipleOf: 0.001, default: 1 }
        unit: { type: string, maxLength: 32 }
        productionDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        shelfLifeValue: { type: integer, minimum: 1, maximum: 1200 }
        shelfLifeUnit: { $ref: '#/components/schemas/ShelfLifeUnit' }
        openedDate: { type: string, format: date }
        afterOpenValue: { type: integer, minimum: 1, maximum: 1200 }
        afterOpenUnit: { $ref: '#/components/schemas/ShelfLifeUnit' }
    UpdateItemRequest:
      type: object
      properties:
        lifecycleStatus: { type: string, enum: [ACTIVE, CONSUMED, DISCARDED, ARCHIVED] }
        name: { type: string, minLength: 1, maxLength: 120 }
        categoryId: { type: string }
        brand: { type: string, maxLength: 120 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 999999999, multipleOf: 0.001 }
        unit: { type: string, maxLength: 32 }
        productionDate: { type: string, format: date }
        expiryDate: { type: string, format: date }
        shelfLifeValue: { type: integer, minimum: 1, maximum: 1200 }
        shelfLifeUnit: { $ref: '#/components/schemas/ShelfLifeUnit' }
        openedDate: { type: string, format: date }
        afterOpenValue: { type: integer, minimum: 1, maximum: 1200 }
        afterOpenUnit: { $ref: '#/components/schemas/ShelfLifeUnit' }
    ItemResponse:
      type: object
      required:
        - id
        - name
        - categoryId
        - lifecycleStatus
        - quantity
        - expiryStatus
        - createdAt
        - updatedAt
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        categoryId: { type: string }
        brand: { type: [string, 'null'] }
        lifecycleStatus: { type: string, enum: [ACTIVE, CONSUMED, DISCARDED, ARCHIVED] }
        quantity: { type: number }
        unit: { type: [string, 'null'] }
        productionDate: { type: [string, 'null'], format: date }
        expiryDate: { type: [string, 'null'], format: date }
        effectiveExpiryDate: { type: [string, 'null'], format: date }
        remainingDays: { type: [integer, 'null'] }
        expiryStatus: { type: string, enum: [UNKNOWN, NORMAL, NEAR_EXPIRY, EXPIRED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ShelfLifeUnit:
      type: string
      enum: [DAY, MONTH, YEAR]
    AttentionDecision:
      type: object
      required: [itemId, score, priority, reasonCodes, ruleVersion]
      properties:
        itemId: { type: string, format: uuid }
        score: { type: integer, minimum: 0, description: Weighted attention score; not a probability }
        priority: { type: string, enum: [HIGH, MEDIUM, LOW] }
        reasonCodes:
          type: array
          items:
            type: string
            enum: [EXPIRED, EXPIRES_TODAY, EXPIRES_TOMORROW, EXPIRES_IN_TWO_DAYS, EXPIRES_IN_THREE_DAYS, EXPIRES_THIS_WEEK, WITHIN_REMINDER_WINDOW, MISSING_EXPIRY, OPENED, PAO_NEAR, SNOOZE_RETURNED, LARGE_QUANTITY]
        effectiveExpiryDate: { type: [string, 'null'], format: date }
        remainingDays: { type: [integer, 'null'] }
        ruleVersion: { type: string, example: attention-rule-v1 }
    InventoryWrite:
      type: object
      required: [payload]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        payload: { type: string, minLength: 2, maxLength: 350000, description: 'Serialized JSON {item, batches}; 1 to 1000 batches, stable UUIDs, quantity up to 3 decimal places, one unit per item' }
    InventorySnapshot:
      type: object
      required: [id, version, payload, updatedAt]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        payload: { type: string }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    BehaviorEvent:
      type: object
      required: [eventId, eventType, eventVersion, occurredAt, properties]
      properties:
        eventId: { type: string, format: uuid }
        eventType: { type: string, enum: [ITEM_CREATED, ITEM_UPDATED, ITEM_CONSUMED, ITEM_PARTIAL_CONSUMED, ITEM_DISCARDED, ITEM_DELETED, ITEM_SNOOZED, DRAFT_SAVED, REMINDER_DELIVERED, REMINDER_ACTION, SUGGESTION_ACCEPTED, DECISION_SHOWN, DECISION_FEEDBACK] }
        eventVersion: { type: string, const: '1.0' }
        occurredAt: { type: string, format: date-time }
        properties:
          type: object
          additionalProperties: false
          required: [itemId]
          properties:
            itemId: { type: string, format: uuid }
            batchId: { type: string, format: uuid }
            quantity: { type: number, exclusiveMinimum: 0 }
            decisionId: { type: string, format: uuid }
            algorithmVersion: { type: string, pattern: '^[a-zA-Z0-9_.-]{1,64}$' }
            action: { type: string, enum: [CONSUMED, DISCARDED, SNOOZE, UNDO, NOT_HELPFUL] }
            score: { type: integer, minimum: 0, maximum: 4000000 }
            remainingDays: { type: integer, minimum: -4000000, maximum: 4000000 }
            opened: { type: boolean }
            mock: { type: boolean }
            reasonCodes:
              type: array
              maxItems: 30
              items: { type: string, pattern: '^[A-Z_]{1,64}$' }
